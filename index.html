<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap"
			rel="stylesheet"
		/>

		<link rel="stylesheet" href="/style.css" />
		<title>Ask Less of the World · Pinonite Source Lab</title>
	</head>
	<body>
		<header class="docket">
			<div><strong>PINONITE / SOURCE LAB</strong><span>ASK LESS OF THE WORLD</span></div>
			<span>QUADTREE QUERY · LIVE</span>
		</header>
		<div id="stats">
			<div>INDEXED <span id="items-count">0</span></div>
			<div>CANDIDATES <span id="items-selected">0</span></div>
		</div>
		<div class="instruction">MOVE TO QUERY · CLICK TO INSERT A RECORD ↗</div>
		<canvas id="canvas"></canvas>
		<script>
			if (new URLSearchParams(location.search).get('lang') === 'es') {
				document.documentElement.lang = 'es';
				document.title = 'Consultas quadtree · Laboratorio Pinonite';
				document.querySelector('.docket div').innerHTML = '<strong>PINONITE / LABORATORIO</strong><span>CONSULTA MENOS AL MUNDO</span>';
				document.querySelector('.docket > span').textContent = 'CONSULTA QUADTREE · EN VIVO';
				document.querySelector('#stats > div:first-child').childNodes[0].textContent = 'INDEXADOS ';
				document.querySelector('#stats > div:last-child').childNodes[0].textContent = 'CANDIDATOS ';
				document.querySelector('.instruction').textContent = 'MUEVE PARA CONSULTAR · CLIC PARA INSERTAR UN REGISTRO ↗';
			}
		</script>
		<script src="/main.js" type="module"></script>
	</body>
</html>
